<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>fxsudan | Admin</title><link rel="stylesheet" href="style.css"></head><body class="dashboard-page"><header class="topbar"><a class="brand" href="index.html">fx<span>sudan</span></a><button class="logout-button" id="logout">Log out</button></header><main class="dashboard-shell"><section class="welcome-block"><div><p class="eyebrow">Operations</p><h1>Payment <span>review.</span></h1><p class="muted">Approve only after independently verifying the transaction on the correct TRON network and wallet.</p></div></section><section class="dashboard-card" style="margin-top:2rem"><div id="payments">Loading…</div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const r=await fetch('/api/admin/payments');if(r.status===401||r.status===403){location.href='index.html';return}const d=await r.json();const box=document.querySelector('#payments');box.innerHTML=d.payments.map(p=>`<article style="padding:1rem 0;border-bottom:1px solid var(--line)"><strong>${esc(p.username)}</strong> · ${esc(p.product)} · ${esc(p.amount)} USDT<br><small>${esc(p.tx_hash)}</small><br><span>${esc(p.status)}</span> ${p.status==='pending'?`<button class="outline-button" data-id="${p.id}" data-status="approved">Approve</button> <button class="outline-button" data-id="${p.id}" data-status="rejected">Reject</button>`:''}</article>`).join('')||'No payments.';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await fetch('/api/admin/payments/'+b.dataset.id+'/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:b.dataset.status})});load();});}
load();document.querySelector('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='index.html'};
</script></body></html>
